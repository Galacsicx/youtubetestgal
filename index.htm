<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GI.tube</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    }

    body {
      background-color: #0f0f0f;
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      height: 60px;
      background-color: #0f0f0f;
      border-bottom: 1px solid #272727;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .upload-btn {
      background-color: #272727;
      color: #ffffff;
      border: 1px solid #3f3f3f;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .upload-btn:hover {
      background-color: #3f3f3f;
    }

    .user-profile {
      display: none;
      align-items: center;
      gap: 12px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 20px;
      transition: background 0.2s;
    }

    .user-info:hover {
      background-color: #272727;
    }

    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: #3f3f3f;
      object-fit: cover;
    }

    .user-name {
      font-size: 14px;
      font-weight: 600;
    }

    .main-layout {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px;
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }

    .player-section {
      flex: 1;
      min-width: 0;
    }

    .back-btn {
      display: none;
      background: #272727;
      color: #ffffff;
      border: 1px solid #3f3f3f;
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 16px;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .back-btn:hover {
      background-color: #3f3f3f;
    }

    .video-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #000000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    video {
      width: 100%;
      height: 100%;
      outline: none;
    }

    .video-details {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .main-uploader-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .main-uploader-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: #3f3f3f;
      object-fit: cover;
    }

    .main-uploader-name {
      font-size: 15px;
      font-weight: 600;
      color: #f1f1f1;
    }

    .current-title {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.3;
      color: #ffffff;
    }

    .main-views {
      font-size: 14px;
      color: #aaaaaa;
      margin-top: -4px;
    }

    .sidebar {
      width: 380px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .sidebar-header {
      font-size: 15px;
      font-weight: 700;
      color: #f1f1f1;
      margin-bottom: 4px;
    }

    .empty-list {
      color: #717171;
      font-size: 13px;
      padding: 12px 0;
    }

    .video-item {
      display: flex;
      gap: 12px;
      cursor: pointer;
      padding: 6px;
      border-radius: 10px;
      transition: background 0.2s;
      position: relative;
      align-items: center;
    }

    .video-item:hover {
      background-color: #272727;
    }

    .video-item.active {
      background-color: #272727;
      border: 1px solid #3f3f3f;
    }

    .thumb-box {
      width: 140px;
      height: 78px;
      background-color: #1f1f1f;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .item-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
    }

    .item-title {
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }

    .item-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #aaaaaa;
    }

    .meta-avatar {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background-color: #3f3f3f;
      object-fit: cover;
    }

    .action-btns {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-left: 4px;
    }

    .delete-btn, .edit-btn {
      background: transparent;
      border: none;
      color: #717171;
      font-size: 16px;
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 6px;
      transition: color 0.2s, background 0.2s;
    }

    .delete-btn:hover {
      color: #ff4e4e;
      background-color: rgba(255, 78, 78, 0.15);
    }

    .edit-btn:hover {
      color: #3ea6ff;
      background-color: rgba(62, 166, 255, 0.15);
    }

    .auth-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .auth-overlay.hidden {
      display: none;
    }

    .auth-box {
      background: #181818;
      border: 1px solid #272727;
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
    }

    .auth-tabs {
      display: flex;
      gap: 4px;
      background: #0f0f0f;
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 20px;
    }

    .auth-tabs button {
      flex: 1;
      background: transparent;
      color: #aaaaaa;
      border: none;
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
    }

    .auth-tabs button.active {
      background: #272727;
      color: #ffffff;
    }

    .auth-box input {
      width: 100%;
      background: #0f0f0f;
      border: 1px solid #272727;
      color: #ffffff;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 12px;
      outline: none;
    }

    .auth-box input:focus {
      border-color: #3f3f3f;
    }

    .auth-error {
      color: #ff4e4e;
      font-size: 13px;
      margin-bottom: 12px;
      min-height: 18px;
    }

    .auth-submit {
      width: 100%;
      background: #ffffff;
      color: #000000;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }

    .auth-submit:hover {
      background: #e5e5e5;
    }

    @media (max-width: 950px) {
      .main-layout {
        flex-direction: column;
        padding: 16px;
        gap: 16px;
      }
      .sidebar {
        width: 100%;
      }
      .player-section {
        width: 100%;
      }
      #playerWrapper {
        display: none;
      }
    }
  </style>
</head>
<body>

  <div class="auth-overlay" id="authOverlay">
    <div class="auth-box">
      <div class="auth-tabs">
        <button type="button" data-tab="login" class="active">Log in</button>
        <button type="button" data-tab="register">Sign up</button>
      </div>
      <form id="authForm" autocomplete="on">
        <input type="text" id="authUsername" placeholder="Username" autocomplete="username" required>
        <input type="password" id="authPassword" placeholder="at least 6 characters" autocomplete="current-password" required minlength="6">
        <div class="auth-error" id="authError"></div>
        <button type="submit" class="auth-submit" id="authSubmit">Log in</button>
      </form>
    </div>
  </div>

  <header>
    <input type="file" id="avatarInput" accept="image/*" style="display: none;">
    <input type="file" id="fileInput" accept="video/*" multiple style="display: none;">
    
    <div class="user-profile" id="userProfile">
      <div class="user-info" onclick="document.getElementById('avatarInput').click()" title="Change avatar">
        <img id="headerAvatar" class="user-avatar" src="" alt="Avatar">
        <span id="headerUsername" class="user-name"></span>
      </div>
      <button class="upload-btn" id="logoutBtn" style="padding: 6px 12px;">Log out</button>
    </div>

    <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
      <span>Download video</span>
    </button>
  </header>

  <div class="main-layout">
    <div class="player-section" id="playerSection">
      <button id="mobileBackBtn" class="back-btn" onclick="showMobileList()">Back</button>
      
      <div id="playerWrapper" style="display: none;">
        <div class="video-container">
          <video id="mainPlayer" controls controlsList="nodownload noplaybackrate"></video>
        </div>
        <div class="video-details">
          <div class="main-uploader-info">
            <img id="mainUploaderAvatar" class="main-uploader-avatar" src="" alt="Avatar">
            <span id="mainUploaderName" class="main-uploader-name"></span>
          </div>
          <div class="current-title" id="mainTitle"></div>
          <div class="main-views" id="mainViews">views - 0</div>
        </div>
      </div>
    </div>

    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">All videos</div>
      <div id="playlist"></div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "ТВОЙ_API_KEY",
      authDomain: "testtubefiles.firebaseapp.com",
      databaseURL: "https://testtubefiles-default-rtdb.firebaseio.com/",
      projectId: "testtubefiles",
      storageBucket: "testtubefiles.appspot.com",
      messagingSenderId: "",
      appId: ""
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let videos = [];
    let activeId = null;
    let currentUser = null;
    let currentUserAvatar = '';
    const MIN_PASSWORD = 6;
    const USERNAME_REGEX = /^[a-zA-Z0-9_]{3,}$/;

    const fileInput = document.getElementById('fileInput');
    const avatarInput = document.getElementById('avatarInput');
    const playerWrapper = document.getElementById('playerWrapper');
    const playerSection = document.getElementById('playerSection');
    const sidebar = document.getElementById('sidebar');
    const mobileBackBtn = document.getElementById('mobileBackBtn');
    const mainPlayer = document.getElementById('mainPlayer');
    const mainTitle = document.getElementById('mainTitle');
    const mainViews = document.getElementById('mainViews');
    const mainUploaderAvatar = document.getElementById('mainUploaderAvatar');
    const mainUploaderName = document.getElementById('mainUploaderName');
    const playlistEl = document.getElementById('playlist');
    
    const overlay = document.getElementById('authOverlay');
    const form = document.getElementById('authForm');
    const usernameEl = document.getElementById('authUsername');
    const passwordEl = document.getElementById('authPassword');
    const errorEl = document.getElementById('authError');
    const submitBtn = document.getElementById('authSubmit');
    const tabs = document.querySelectorAll('.auth-tabs button');
    
    const userProfile = document.getElementById('userProfile');
    const headerAvatar = document.getElementById('headerAvatar');
    const headerUsername = document.getElementById('headerUsername');
    const logoutBtn = document.getElementById('logoutBtn');

    let mode = 'login';
    const defaultAvatar = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23aaaaaa"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>';

    function escapeHTML(str) {
      return String(str).replace(/[&<>'"]/g, 
        tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[tag] || tag)
      );
    }

    usernameEl.addEventListener('input', function() {
      this.value = this.value.replace(/[^a-zA-Z0-9_]/g, '');
    });

    function initApp() {
      const savedUser = localStorage.getItem('gitube_session_user');
      
      if (savedUser) {
        if (!USERNAME_REGEX.test(savedUser)) {
          localStorage.removeItem('gitube_session_user');
          showAuthScreen();
          return;
        }
        
        db.ref('users/' + savedUser).once('value').then(snapshot => {
          if (snapshot.exists()) {
            executeLogin(savedUser, snapshot.val().avatar);
          } else {
            showAuthScreen();
          }
        });
      } else {
        showAuthScreen();
      }
    }

    async function hashPassword(pw) {
      try {
        if (window.crypto && crypto.subtle && crypto.subtle.digest) {
          const data = new TextEncoder().encode(pw);
          const buf = await crypto.subtle.digest('SHA-256', data);
          return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        }
      } catch (e) {}
      let h = 0;
      for (let i = 0; i < pw.length; i++) h = (h * 31 + pw.charCodeAt(i)) | 0;
      return 'fb_' + Math.abs(h).toString(16);
    }

    function executeLogin(username, avatar) {
      currentUser = username;
      currentUserAvatar = avatar || defaultAvatar;
      
      localStorage.setItem('gitube_session_user', username);
      
      overlay.classList.add('hidden');
      userProfile.style.display = 'flex';
      headerUsername.textContent = currentUser;
      headerAvatar.src = currentUserAvatar;
      
      loadVideos();
    }

    function showAuthScreen() {
      currentUser = null;
      overlay.classList.remove('hidden');
      userProfile.style.display = 'none';
      playlistEl.innerHTML = '';
      playerWrapper.style.display = 'none';
      mainPlayer.removeAttribute('src');
      
      form.reset();
      errorEl.textContent = '';
      mode = 'login';
      tabs.forEach(b => b.classList.toggle('active', b.dataset.tab === 'login'));
      submitBtn.textContent = 'Log in';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';
      const username = usernameEl.value.trim();
      const password = passwordEl.value;

      if (!username) return errorEl.textContent = 'Enter username';
      if (!USERNAME_REGEX.test(username)) {
        return errorEl.textContent = 'Username must be at least 3 characters and contain only English letters, numbers, and underscores.';
      }
      if (password.length < MIN_PASSWORD) return errorEl.textContent = `Password must be at least ${MIN_PASSWORD} characters`;

      const hash = await hashPassword(password);
      const userRef = db.ref('users/' + username);

      userRef.once('value').then(snapshot => {
        if (mode === 'register') {
          if (snapshot.exists()) {
            errorEl.textContent = 'User already exists';
          } else {
            userRef.set({ passwordHash: hash, avatar: defaultAvatar, createdAt: Date.now() }).then(() => {
              executeLogin(username, defaultAvatar);
            });
          }
        } else {
          const user = snapshot.val();
          if (!user || user.passwordHash !== hash) {
            errorEl.textContent = 'Invalid username or password';
          } else {
            executeLogin(username, user.avatar);
          }
        }
      }).catch(err => {
        errorEl.textContent = 'Firebase error: ' + err.message;
      });
    });

    tabs.forEach(btn => {
      btn.addEventListener('click', () => {
        mode = btn.dataset.tab;
        tabs.forEach(b => b.classList.toggle('active', b === btn));
        submitBtn.textContent = mode === 'login' ? 'Log in' : 'Sign up';
        errorEl.textContent = '';
      });
    });

    logoutBtn.addEventListener('click', () => {
      localStorage.removeItem('gitube_session_user');
      showAuthScreen();
    });

    avatarInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file || !currentUser) return;
      
      const reader = new FileReader();
      reader.onload = function(evt) {
        const base64Img = evt.target.result;
        db.ref('users/' + currentUser + '/avatar').set(base64Img).then(() => {
          currentUserAvatar = base64Img;
          headerAvatar.src = currentUserAvatar;
          loadVideos();
        });
      };
      reader.readAsDataURL(file);
      avatarInput.value = '';
    });

    function loadVideos() {
      if (!currentUser) return;
      
      db.ref('videos_meta').on('value', snapshot => {
        videos = [];
        const data = snapshot.val();
        
        if (data) {
          db.ref('users').once('value').then(usersSnap => {
            const users = usersSnap.val() || {};
            
            Object.keys(data).forEach(key => {
              const item = data[key];
              const authorName = item.uploader || 'Unknown';
              const authorAvatar = (users[authorName] && users[authorName].avatar) ? users[authorName].avatar : defaultAvatar;
              
              videos.push({
                id: key,
                title: item.title,
                uploader: authorName,
                avatar: authorAvatar,
                timestamp: item.timestamp || 0,
                views: item.views || 0
              });
            });
            
            videos.sort((a, b) => b.timestamp - a.timestamp);
            renderPlaylist();
            
            if (activeId && videos.find(v => v.id === activeId)) {
              const cur = videos.find(v => v.id === activeId);
              mainUploaderAvatar.src = cur.avatar;
              mainUploaderName.textContent = cur.uploader;
              mainTitle.textContent = cur.title;
              mainViews.textContent = `views - ${cur.views}`;
            } else if (activeId) {
              activeId = null;
              playerWrapper.style.display = 'none';
              mainPlayer.pause();
            }
          });
        } else {
          renderPlaylist();
        }
      });
    }

    fileInput.addEventListener('change', function(event) {
      const files = Array.from(event.target.files);
      if (files.length === 0 || !currentUser) return;

      files.forEach(file => {
        if (file.size > 9.5 * 1024 * 1024) {
          alert(`Video "${file.name}" is too large (${(file.size/1024/1024).toFixed(1)} MB). limite 10mb`);
          return;
        }

        const cleanName = file.name.replace(/\.[^/.]+$/, "");
        const reader = new FileReader();
        
        reader.onload = function(e) {
          const base64Data = e.target.result;
          const newVideoRef = db.ref('videos_meta').push();
          const videoId = newVideoRef.key;

          newVideoRef.set({
            title: cleanName,
            uploader: currentUser,
            timestamp: Date.now(),
            views: 0
          }).then(() => {
            return db.ref('videos_data/' + videoId).set({
              base64: base64Data
            });
          }).catch(err => {
            alert("Database upload error: " + err.message);
          });
        };
        reader.readAsDataURL(file);
      });

      fileInput.value = "";
    });

    mainPlayer.addEventListener('ended', () => mainPlayer.controls = false);
    mainPlayer.addEventListener('mouseenter', () => mainPlayer.controls = true);
    mainPlayer.addEventListener('play', () => mainPlayer.controls = true);

    function renderPlaylist() {
      playlistEl.innerHTML = "";

      if (videos.length === 0) {
        playlistEl.innerHTML = '<div class="empty-list">No videos yet. Upload one!</div>';
        return;
      }

      videos.forEach(vid => {
        const item = document.createElement('div');
        item.className = 'video-item' + (vid.id === activeId ? ' active' : '');
        item.onclick = () => playVideo(vid.id);

        let actionBtnsHTML = '';
        if (vid.uploader === currentUser) {
            actionBtnsHTML = `
                <div class="action-btns">
                    <button class="edit-btn" onclick="editVideo(event, '${vid.id}', '${escapeHTML(vid.title)}')" title="Edit title">✎</button>
                    <button class="delete-btn" onclick="deleteVideo(event, '${vid.id}')" title="Delete">✕</button>
                </div>
            `;
        }

        item.innerHTML = `
          <div class="thumb-box">
            <div style="color: #717171; font-size: 24px;">▶</div>
          </div>
          <div class="item-info">
            <div class="item-title">${escapeHTML(vid.title)}</div>
            <div class="item-meta">
              <img class="meta-avatar" src="${vid.avatar}" alt="">
              <span>${escapeHTML(vid.uploader)}</span>
            </div>
            <div class="item-meta" style="margin-top: 2px;">
              <span>views - ${vid.views}</span>
            </div>
          </div>
          ${actionBtnsHTML}
        `;
        playlistEl.appendChild(item);
      });
    }

    function playVideo(id) {
      const selected = videos.find(v => v.id === id);
      if (!selected) return;

      activeId = id;
      playerWrapper.style.display = 'block';
      mainPlayer.controls = true;
      
      if (window.innerWidth <= 950) {
        sidebar.style.display = 'none';
        mobileBackBtn.style.display = 'flex';
        window.scrollTo(0, 0);
      }

      mainUploaderAvatar.src = selected.avatar;
      mainUploaderName.textContent = selected.uploader;
      mainTitle.textContent = selected.title;
      mainViews.textContent = `views - ${selected.views}`;
      
      mainPlayer.src = "";
      mainPlayer.pause();

      const sessionKey = 'viewed_' + id;
      if (!sessionStorage.getItem(sessionKey)) {
        db.ref('videos_meta/' + id + '/views').transaction(currentViews => {
          return (currentViews || 0) + 1;
        });
        sessionStorage.setItem(sessionKey, 'true');
        selected.views++;
        mainViews.textContent = `views - ${selected.views}`;
      }

      db.ref('videos_data/' + id).once('value').then(snapshot => {
        const data = snapshot.val();
        
        if (data && data.base64) {
          mainPlayer.src = data.base64;
          mainPlayer.play().catch(() => {});
        } else {
          alert("Error");
        }
      }).catch(err => {
        alert("Load error: " + err.message);
      });

      renderPlaylist();
    }

    window.editVideo = function(event, id, currentTitle) {
      event.stopPropagation();
      const newTitle = prompt("Enter new video title:", currentTitle);
      if (newTitle !== null && newTitle.trim() !== "" && newTitle !== currentTitle) {
        db.ref('videos_meta/' + id + '/title').set(newTitle.trim()).then(() => {
          if (activeId === id) {
             mainTitle.textContent = newTitle.trim();
          }
        }).catch(err => {
          alert("Error updating title: " + err.message);
        });
      }
    };

    window.showMobileList = function() {
      if (window.innerWidth <= 950) {
        playerWrapper.style.display = 'none';
        sidebar.style.display = 'flex';
        mobileBackBtn.style.display = 'none';
        mainPlayer.pause();
      }
    };

    window.deleteVideo = function(event, id) {
      event.stopPropagation();
      const vid = videos.find(v => v.id === id);
      
      if (!vid || vid.uploader !== currentUser) return;

      if (confirm("Delete video?")) {
        db.ref('videos_meta/' + id).remove();
        db.ref('videos_data/' + id).remove();
        
        if (activeId === id) {
          activeId = null;
          playerWrapper.style.display = 'none';
          mainPlayer.pause();
          mainPlayer.removeAttribute('src');
          
          if (window.innerWidth <= 950) {
            sidebar.style.display = 'flex';
            mobileBackBtn.style.display = 'none';
          }
        }
      }
    };

    window.addEventListener('resize', () => {
      if (window.innerWidth > 950) {
        sidebar.style.display = 'flex';
        mobileBackBtn.style.display = 'none';
        if (activeId) {
          playerWrapper.style.display = 'block';
        }
      } else {
        if (!activeId) {
          playerWrapper.style.display = 'none';
          sidebar.style.display = 'flex';
          mobileBackBtn.style.display = 'none';
        }
      }
    });

    initApp();
  </script>
</body>
</html>
