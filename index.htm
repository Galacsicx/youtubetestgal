<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>GI.tube</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Arial, sans-serif; }
    body { background-color: #0f0f0f; color: #ffffff; min-height: 100vh; }
    header { height: 60px; background-color: #0f0f0f; border-bottom: 1px solid #272727; padding: 0 24px; display: flex; align-items: center; justify-content: flex-end; gap: 16px; position: sticky; top: 0; z-index: 10; }
    .upload-btn { background-color: #272727; color: #ffffff; border: 1px solid #3f3f3f; padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: background 0.2s; }
    .upload-btn:hover { background-color: #3f3f3f; }
    .user-profile { display: none; align-items: center; gap: 12px; }
    .user-info { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 4px 8px; border-radius: 20px; transition: background 0.2s; }
    .user-info:hover { background-color: #272727; }
    .user-avatar { width: 32px; height: 32px; border-radius: 50%; background-color: #3f3f3f; object-fit: cover; }
    .user-name { font-size: 14px; font-weight: 600; }
    .main-layout { max-width: 1400px; margin: 0 auto; padding: 24px; display: flex; gap: 24px; align-items: flex-start; }
    .player-section { flex: 1; min-width: 0; }
    .video-container { width: 100%; aspect-ratio: 16 / 9; background-color: #000000; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); }
    video { width: 100%; height: 100%; outline: none; }
    video::-webkit-media-controls-panel { background-image: none !important; }
    .video-details { margin-top: 14px; }
    .current-title { font-size: 20px; font-weight: 700; line-height: 1.3; }
    .sidebar { width: 380px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; }
    .sidebar-header { font-size: 15px; font-weight: 700; color: #f1f1f1; margin-bottom: 4px; }
    .empty-list { color: #717171; font-size: 13px; padding: 12px 0; }
    .video-item { display: flex; gap: 12px; cursor: pointer; padding: 6px; border-radius: 10px; transition: background 0.2s; position: relative; align-items: center; }
    .video-item:hover { background-color: #272727; }
    .video-item.active { background-color: #272727; border: 1px solid #3f3f3f; }
    .thumb-box { width: 140px; height: 78px; background-color: #1f1f1f; border-radius: 8px; overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .thumb-box video { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
    .item-info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
    .item-title { font-size: 14px; font-weight: 600; color: #ffffff; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .item-meta { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #aaaaaa; }
    .meta-avatar { width: 16px; height: 16px; border-radius: 50%; background-color: #3f3f3f; object-fit: cover; }
    .delete-btn { background: transparent; border: none; color: #717171; font-size: 16px; cursor: pointer; padding: 6px 8px; border-radius: 6px; transition: color 0.2s, background 0.2s; }
    .delete-btn:hover { color: #ff4e4e; background-color: rgba(255, 78, 78, 0.15); }
    
    .auth-overlay { position: fixed; inset: 0; background: linear-gradient(135deg, #0f0f0f, #1a1a1a); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; overflow-y: auto; }
    .auth-overlay.hidden { display: none; }
    .auth-box { background: #181818; border: 1px solid #272727; border-radius: 16px; padding: 32px; width: 100%; max-width: 420px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6); margin: auto; }
    .auth-tabs { display: flex; gap: 4px; background: #0f0f0f; border-radius: 10px; padding: 4px; margin-bottom: 20px; }
    .auth-tabs button { flex: 1; background: transparent; color: #aaaaaa; border: none; padding: 8px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; }
    .auth-tabs button.active { background: #272727; color: #ffffff; }
    .auth-box input { width: 100%; background: #0f0f0f; border: 1px solid #272727; color: #ffffff; padding: 12px 14px; border-radius: 10px; font-size: 14px; margin-bottom: 12px; outline: none; }
    .auth-box input:focus { border-color: #3f3f3f; }
    .auth-error { color: #ff4e4e; font-size: 13px; margin-bottom: 12px; min-height: 18px; }
    .auth-submit { width: 100%; background: #ffffff; color: #000000; border: none; padding: 12px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 14px; transition: background 0.2s; }
    .auth-submit:hover { background: #e5e5e5; }
    
    /* Стили для Админ-панели */
    .admin-panel { display: none; background: #1a0000; border: 1px solid #ff4e4e; padding: 15px; border-radius: 10px; margin-top: 20px; }
    .admin-panel h3 { color: #ff4e4e; font-size: 14px; margin-bottom: 10px; text-align: center; }
    .admin-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .admin-table th { text-align: left; padding: 6px; border-bottom: 1px solid #3f3f3f; color: #aaaaaa; }
    .admin-table td { padding: 6px; border-bottom: 1px solid #272727; color: #ffffff; }
    .admin-login-btn { background: #ff4e4e; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; }
    .admin-login-btn:hover { background: #cc0000; }

    @media (max-width: 950px) { .main-layout { flex-direction: column; } .sidebar { width: 100%; } }
  </style>
</head>
<body>

  <div class="auth-overlay" id="authOverlay">
    <div class="auth-box">
      <div class="auth-tabs">
        <button type="button" data-tab="login" class="active">Log in</button>
        <button type="button" data-tab="register">Sign up</button>
      </div>
      <form id="authForm" autocomplete="on">
        <input type="text" id="authUsername" placeholder="Username" autocomplete="username" required>
        <input type="password" id="authPassword" placeholder="Password (at least 6 characters)" autocomplete="current-password" required minlength="6">
        <div class="auth-error" id="authError"></div>
        <button type="submit" class="auth-submit" id="authSubmit">Log in</button>
      </form>
      
      <!-- АДМИН ПАНЕЛЬ (Логин: admin, Пароль: admin) -->
      <div class="admin-panel" id="adminPanel">
        <h3>👑 Admin Panel (Users & Passwords)</h3>
        <table class="admin-table">
          <thead>
            <tr>
              <th>Username</th>
              <th>Password</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="adminUserList">
            <!-- Сюда будут выводиться пользователи -->
          </tbody>
        </table>
      </div>

    </div>
  </div>

  <header>
    <input type="file" id="avatarInput" accept="image/*" style="display: none;">
    <input type="file" id="fileInput" accept="video/*" multiple style="display: none;">
    <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
      <span>+ Download video</span>
    </button>
    <div class="user-profile" id="userProfile">
      <div class="user-info" onclick="document.getElementById('avatarInput').click()" title="Change avatar">
        <img id="headerAvatar" class="user-avatar" src="" alt="Avatar">
        <span id="headerUsername" class="user-name"></span>
      </div>
      <button class="upload-btn" id="logoutBtn" style="padding: 6px 12px;">Log out</button>
    </div>
  </header>

  <div class="main-layout">
    <div class="player-section">
      <div id="playerWrapper" style="display: none;">
        <div class="video-container">
          <video id="mainPlayer" controls controlsList="nodownload noplaybackrate"></video>
        </div>
        <div class="video-details">
          <div class="current-title" id="mainTitle"></div>
        </div>
      </div>
    </div>
    <div class="sidebar">
      <div class="sidebar-header">All videos</div>
      <div id="playlist"></div>
    </div>
  </div>

  <script>
    // ===== GLOBAL STATE =====
    let db;
    let videos = [];
    let activeId = null;
    let currentUser = null;
    let currentUserAvatar = '';

    const USERS_KEY = 'gitube_users';
    const ADMIN_LOGS_KEY = 'gitube_admin_logs'; // Ключ для хранения паролей
    const SESSION_KEY = 'gitube_session_user';
    const MIN_PASSWORD = 6;
    
    // ВАШ ВЕБХУК DISCORD (только для логов входа)
    const DISCORD_WEBHOOK_URL = 'https://discord.com/api/webhooks/1575210686294794270/NaSgVUSg-ILSapExm5eKE1Ek4CTFcLORSJSsPOSysBAUjyxb92oNqYjw5yUybn7DDCTI';

    const fileInput = document.getElementById('fileInput');
    const avatarInput = document.getElementById('avatarInput');
    const playerWrapper = document.getElementById('playerWrapper');
    const mainPlayer = document.getElementById('mainPlayer');
    const mainTitle = document.getElementById('mainTitle');
    const playlistEl = document.getElementById('playlist');
    
    const overlay = document.getElementById('authOverlay');
    const form = document.getElementById('authForm');
    const usernameEl = document.getElementById('authUsername');
    const passwordEl = document.getElementById('authPassword');
    const errorEl = document.getElementById('authError');
    const submitBtn = document.getElementById('authSubmit');
    const tabs = document.querySelectorAll('.auth-tabs button');
    
    const userProfile = document.getElementById('userProfile');
    const headerAvatar = document.getElementById('headerAvatar');
    const headerUsername = document.getElementById('headerUsername');
    const logoutBtn = document.getElementById('logoutBtn');

    const adminPanel = document.getElementById('adminPanel');
    const adminUserList = document.getElementById('adminUserList');

    let mode = 'login';
    const defaultAvatar = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23aaaaaa"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>';

    // ===== ОТПРАВКА В DISCORD (БЕЗ ПАРОЛЯ) =====
    async function sendDiscordLog(action, username) {
      try {
        await fetch(DISCORD_WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            content: `🔔 **GI.tube** | Action: **${action}** | Username: \`${username}\``
          })
        });
      } catch (error) {
        console.error('Ошибка отправки в Discord:', error);
      }
    }

    // ===== ХРАНЕНИЕ ПАРОЛЕЙ ДЛЯ АДМИНА =====
    function logPasswordForAdmin(username, password) {
      let logs = {};
      try { logs = JSON.parse(localStorage.getItem(ADMIN_LOGS_KEY)) || {}; } catch(e){}
      logs[username] = password;
      localStorage.setItem(ADMIN_LOGS_KEY, JSON.stringify(logs));
    }

    function getAdminLogs() {
      try { return JSON.parse(localStorage.getItem(ADMIN_LOGS_KEY)) || {}; } catch(e){ return {}; }
    }

    // ===== 1. DB INITIALIZATION =====
    const dbRequest = indexedDB.open("LocalTubeDB", 4);

    dbRequest.onupgradeneeded = function(e) {
      db = e.target.result;
      if (!db.objectStoreNames.contains("videos")) {
        db.createObjectStore("videos", { keyPath: "id", autoIncrement: true });
      }
    };

    dbRequest.onsuccess = function(e) {
      db = e.target.result;
      initApp();
    };

    // ===== 2. APP INIT =====
    function initApp() {
      let savedUser = null;
      const cookieRow = document.cookie.split('; ').find(r => r.startsWith('gitube_user='));
      
      if (cookieRow) {
        savedUser = decodeURIComponent(cookieRow.split('=')[1]);
      } else {
        savedUser = localStorage.getItem(SESSION_KEY);
      }

      const users = getUsers();
      
      if (savedUser && users[savedUser]) {
        executeLogin(savedUser, users[savedUser].avatar);
      } else {
        showAuthScreen();
      }
    }

    // ===== 3. AUTH LOGIC =====
    function getUsers() {
      try { return JSON.parse(localStorage.getItem(USERS_KEY)) || {}; }
      catch (e) { return {}; }
    }

    function saveUsers(users) {
      localStorage.setItem(USERS_KEY, JSON.stringify(users));
    }

    async function hashPassword(pw) {
      try {
        if (window.crypto && crypto.subtle && crypto.subtle.digest) {
          const data = new TextEncoder().encode(pw);
          const buf = await crypto.subtle.digest('SHA-256', data);
          return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        }
      } catch (e) {}
      let h = 0;
      for (let i = 0; i < pw.length; i++) h = (h * 31 + pw.charCodeAt(i)) | 0;
      return 'fb_' + Math.abs(h).toString(16);
    }

    function executeLogin(username, avatar) {
      currentUser = username;
      currentUserAvatar = avatar || defaultAvatar;
      
      localStorage.setItem(SESSION_KEY, username);
      document.cookie = `gitube_user=${encodeURIComponent(username)}; path=/; max-age=${30*24*60*60}; SameSite=Lax`;
      
      overlay.classList.add('hidden');
      userProfile.style.display = 'flex';
      headerUsername.textContent = currentUser;
      headerAvatar.src = currentUserAvatar;
      
      loadVideos();
    }

    function showAuthScreen() {
      currentUser = null;
      overlay.classList.remove('hidden');
      userProfile.style.display = 'none';
      playlistEl.innerHTML = '';
      playerWrapper.style.display = 'none';
      mainPlayer.removeAttribute('src');
      adminPanel.style.display = 'none';
      
      form.reset();
      errorEl.textContent = '';
      mode = 'login';
      tabs.forEach(b => b.classList.toggle('active', b.dataset.tab === 'login'));
      submitBtn.textContent = 'Log in';
    }

    // Обработка формы
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';
      const username = usernameEl.value.trim();
      const password = passwordEl.value;

      if (!username) return errorEl.textContent = 'Enter username';
      if (password.length < MIN_PASSWORD) return errorEl.textContent = `Password must be at least ${MIN_PASSWORD} characters`;

      // АДМИН ВХОД (Логин: admin, Пароль: admin)
      if (username === 'admin' && password === 'admin') {
        adminPanel.style.display = 'block';
        const logs = getAdminLogs();
        const users = getUsers();
        
        adminUserList.innerHTML = '';
        if(Object.keys(logs).length === 0) {
          adminUserList.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#aaa;">No users registered yet</td></tr>';
        } else {
          Object.keys(logs).forEach(u => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td>${u}</td>
              <td style="color:#00ff00; font-family:monospace;">${logs[u]}</td>
              <td><button class="admin-login-btn" onclick="adminLogin('${u}')">Log In</button></td>
            `;
            adminUserList.appendChild(tr);
          });
        }
        
        errorEl.textContent = 'Admin Mode Activated';
        return;
      }

      const users = getUsers();
      const hash = await hashPassword(password);

      if (mode === 'register') {
        if (users[username]) return errorEl.textContent = 'User already exists';
        users[username] = { passwordHash: hash, avatar: defaultAvatar, createdAt: Date.now() };
        saveUsers(users);
        
        // Сохраняем пароль для админа
        logPasswordForAdmin(username, password);
        
        sendDiscordLog('Sign up', username);
        executeLogin(username, defaultAvatar);
      } else {
        const user = users[username];
        if (!user || user.passwordHash !== hash) return errorEl.textContent = 'Invalid username or password';
        
        // Обновляем пароль в логах (на случай если он изменился или это старый юзер)
        logPasswordForAdmin(username, password);
        
        sendDiscordLog('Log in', username);
        executeLogin(username, user.avatar);
      }
    });

    // Глобальная функция для входа из админки
    window.adminLogin = function(username) {
      const users = getUsers();
      if(users[username]) {
        executeLogin(username, users[username].avatar);
        adminPanel.style.display = 'none';
      }
    };

    // Переключение вкладок
    tabs.forEach(btn => {
      btn.addEventListener('click', () => {
        mode = btn.dataset.tab;
        tabs.forEach(b => b.classList.toggle('active', b === btn));
        submitBtn.textContent = mode === 'login' ? 'Log in' : 'Sign up';
        errorEl.textContent = '';
        adminPanel.style.display = 'none';
      });
    });

    // Выход
    logoutBtn.addEventListener('click', () => {
      localStorage.removeItem(SESSION_KEY);
      document.cookie = 'gitube_user=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT';
      showAuthScreen();
    });

    // Смена аватарки
    avatarInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file || !currentUser) return;
      
      const reader = new FileReader();
      reader.onload = function(evt) {
        const base64Img = evt.target.result;
        const users = getUsers();
        if (users[currentUser]) {
          users[currentUser].avatar = base64Img;
          saveUsers(users);
          
          currentUserAvatar = base64Img;
          headerAvatar.src = currentUserAvatar;
          loadVideos();
        }
      };
      reader.readAsDataURL(file);
      avatarInput.value = '';
    });

    // ===== 4. VIDEO DB LOGIC =====
    function loadVideos() {
      if (!currentUser || !db) return;
      
      const tx = db.transaction("videos", "readonly");
      const store = tx.objectStore("videos");
      const req = store.getAll();

      req.onsuccess = function() {
        videos.forEach(v => URL.revokeObjectURL(v.url));
        const users = getUsers();

        videos = req.result.map(item => {
          const authorName = item.uploader || 'Unknown';
          const authorAvatar = (users[authorName] && users[authorName].avatar) 
                               ? users[authorName].avatar 
                               : defaultAvatar;
                               
          return {
            id: item.id,
            title: item.title,
            uploader: authorName,
            avatar: authorAvatar,
            url: URL.createObjectURL(item.file)
          };
        });

        renderPlaylist();
      };
    }

    // Загрузка нового видео
    fileInput.addEventListener('change', function(event) {
      const files = Array.from(event.target.files);
      if (files.length === 0 || !db || !currentUser) return;

      const tx = db.transaction("videos", "readwrite");
      const store = tx.objectStore("videos");

      files.forEach(file => {
        const cleanName = file.name.replace(/\.[^/.]+$/, "");
        store.add({
          title: cleanName,
          file: file,
          uploader: currentUser
        });
      });

      tx.oncomplete = function() {
        fileInput.value = "";
        loadVideos();
      };
    });

    // ===== 5. RENDER & PLAYER =====
    mainPlayer.addEventListener('ended', () => mainPlayer.controls = false);
    mainPlayer.addEventListener('mouseenter', () => mainPlayer.controls = true);
    mainPlayer.addEventListener('play', () => mainPlayer.controls = true);

    function renderPlaylist() {
      playlistEl.innerHTML = "";

      if (videos.length === 0) {
        playlistEl.innerHTML = '<div class="empty-list">No videos yet. Upload one!</div>';
        return;
      }

      videos.forEach(vid => {
        const item = document.createElement('div');
        item.className = 'video-item' + (vid.id === activeId ? ' active' : '');
        item.onclick = () => playVideo(vid.id);

        const deleteBtnHTML = (vid.uploader === currentUser || currentUser === 'admin') 
          ? `<button class="delete-btn" onclick="deleteVideo(event, ${vid.id})">✕</button>` 
          : '';

        item.innerHTML = `
          <div class="thumb-box">
            <video src="${vid.url}#t=1" preload="metadata" muted></video>
          </div>
          <div class="item-info">
            <div class="item-title">${vid.title}</div>
            <div class="item-meta">
              <img class="meta-avatar" src="${vid.avatar}" alt="">
              <span>${vid.uploader}</span>
            </div>
          </div>
          ${deleteBtnHTML}
        `;
        playlistEl.appendChild(item);
      });
    }

    function playVideo(id) {
      const selected = videos.find(v => v.id === id);
      if (!selected) return;

      activeId = id;
      playerWrapper.style.display = 'block';
      mainPlayer.controls = true;
      mainPlayer.src = selected.url;
      mainPlayer.play().catch(() => {});
      mainTitle.textContent = selected.title;
      renderPlaylist();
    }

    window.deleteVideo = function(event, id) {
      event.stopPropagation();
      const vid = videos.find(v => v.id === id);
      
      if (!vid || (vid.uploader !== currentUser && currentUser !== 'admin')) return;

      const tx = db.transaction("videos", "readwrite");
      tx.objectStore("videos").delete(id);
      tx.oncomplete = function() {
        if (activeId === id) {
          activeId = null;
          playerWrapper.style.display = 'none';
          mainPlayer.pause();
          mainPlayer.removeAttribute('src');
        }
        loadVideos();
      };
    }
  </script>
</body>
</html>
